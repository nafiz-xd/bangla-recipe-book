<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Recipe Book — Bangladeshi Recipes</title>
<meta name="description" content="A collection of classic Bangladeshi recipes with photos, ingredients and step-by-step cooking instructions.">
<style>
  :root{
    --bg:#FFF9F2; --card:#FFFFFF; --ink:#2B2118; --muted:#7A6A5C;
    --brand:#C1440E; --brand-dark:#9A3409; --accent:#1E7A46;
    --chip:#F3E7DA; --border:#EADBCB; --shadow:0 6px 24px rgba(90,50,20,.10);
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:linear-gradient(135deg,#C1440E,#8F2D0A);color:#fff;padding:44px 20px 36px;text-align:center}
  header h1{font-size:2.3rem;letter-spacing:.5px}
  header h1 .bn{font-weight:600}
  header p{opacity:.92;margin-top:8px;font-size:1.02rem}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 60px}
  .controls{position:sticky;top:0;background:var(--bg);padding:18px 0 12px;z-index:20}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  .search-row input[type="search"]{flex:1 1 260px;padding:12px 16px;border:1.5px solid var(--border);border-radius:999px;font-size:1rem;background:#fff;outline:none}
  .search-row input[type="search"]:focus{border-color:var(--brand)}
  .fav-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1.5px solid var(--border);border-radius:999px;background:#fff;cursor:pointer;font-size:.95rem;font-weight:600;color:var(--ink)}
  .fav-toggle.active{border-color:#D6336C;color:#D6336C;background:#FFF0F5}
  .fav-toggle svg{width:18px;height:18px;fill:none;stroke:#D6336C;stroke-width:2}
  .fav-toggle.active svg{fill:#D6336C}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{padding:7px 16px;border-radius:999px;background:var(--chip);border:1px solid transparent;font-size:.9rem;font-weight:600;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--brand)}
  .chip.active{background:var(--brand);color:#fff}
  .count{margin:16px 2px 10px;color:var(--muted);font-size:.92rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s ease}
  .card:hover{transform:translateY(-3px)}
  .card .photo{position:relative;cursor:pointer}
  .card img{width:100%;height:180px;object-fit:cover;display:block}
  .badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:var(--brand-dark);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px}
  .heart{position:absolute;right:10px;top:10px;width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .heart svg{width:20px;height:20px;fill:none;stroke:#D6336C;stroke-width:2}
  .heart.on svg{fill:#D6336C}
  .card-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-body h3{font-size:1.12rem;cursor:pointer}
  .card-body h3:hover{color:var(--brand)}
  .card-body .bn-name{color:var(--accent);font-weight:600;font-size:.98rem}
  .card-body p{color:var(--muted);font-size:.9rem;flex:1}
  .meta{display:flex;gap:14px;font-size:.83rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .meta b{color:var(--ink)}
  .view-btn{margin-top:12px;padding:9px 14px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;font-size:.92rem}
  .view-btn:hover{background:var(--brand-dark)}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:1.02rem}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(30,18,10,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 14px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:760px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal img.hero{width:100%;height:300px;object-fit:cover;display:block}
  .modal-body{padding:22px 26px 28px}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .modal-head h2{font-size:1.55rem}
  .modal-head .bn-name{color:var(--accent);font-weight:600}
  .close-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:1.15rem;cursor:pointer;line-height:1}
  .modal .meta{margin:10px 0 4px;font-size:.9rem}
  .modal .desc{color:var(--muted);margin:8px 0 18px}
  .modal h3{margin:18px 0 10px;font-size:1.08rem;color:var(--brand-dark)}
  .ing-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
  .ing-list li{padding:7px 10px;background:#FBF3EA;border-radius:8px;font-size:.93rem}
  .steps{list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:10px}
  .steps li{counter-increment:step;display:flex;gap:12px;font-size:.96rem}
  .steps li::before{content:counter(step);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .modal .heart{position:static;box-shadow:none;border:1px solid var(--border)}
  footer{text-align:center;color:var(--muted);font-size:.88rem;padding:24px 16px 34px}
  @media (max-width:560px){
    header h1{font-size:1.7rem}
    .ing-list{grid-template-columns:1fr}
    .modal img.hero{height:210px}
  }
</style>
</head>
<body>

<header>
  <h1>Bangla Recipe Book <span class="bn">· বাংলা রেসিপি</span></h1>
  <p>Classic Bangladeshi dishes — with photos, ingredients and step-by-step cooking.</p>
</header>

<div class="wrap">
  <div class="controls">
    <div class="search-row">
      <input type="search" id="search" placeholder="Search by dish name or ingredient — try &quot;ilish&quot;, &quot;egg&quot;, &quot;mustard&quot;…" aria-label="Search recipes">
      <button class="fav-toggle" id="favToggle" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.3C.3 8.6 2 4.5 5.6 4.1c2-.2 3.9.8 4.9 2.4.4.7 2.6.7 3 0 1-1.6 2.9-2.6 4.9-2.4 3.6.4 5.3 4.5 3.6 7.6C19.5 16.1 12 21 12 21z" transform="scale(0.92) translate(1,0.4)"/></svg>
        Favorites only
      </button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No recipes match your search. Try another dish or ingredient.</p>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<footer>Made with care by Nafiz Bin Azad · Photos from Wikimedia Commons</footer>

<script>
const RECIPES = [
  {
    id: 1, name: "Ilish Bhaja", bn: "ইলিশ ভাজা", category: "Main", img: "images/r1.jpg",
    time: "25 min", servings: 4, difficulty: "Easy",
    desc: "Crispy fried hilsa — the king of Bangladeshi fish — simply spiced with turmeric and salt, fried in mustard oil until golden.",
    ingredients: ["4 pieces ilish (hilsa) fish", "1 tsp turmeric powder", "1 tsp red chilli powder", "Salt to taste", "4 tbsp mustard oil", "2 green chillies, slit", "Lemon wedges to serve"],
    steps: [
      "Wash the ilish pieces gently and pat them dry.",
      "Rub the fish with turmeric, chilli powder and salt. Rest for 10 minutes.",
      "Heat mustard oil in a pan until it just starts to smoke, then lower the heat.",
      "Fry the fish pieces 3–4 minutes per side until golden and crisp.",
      "Add the slit green chillies in the last minute for aroma.",
      "Serve hot with plain rice and lemon wedges."
    ]
  },
  {
    id: 2, name: "Beef Tehari", bn: "গরুর তেহারি", category: "Rice", img: "images/r2.jpg",
    time: "1 hr 10 min", servings: 6, difficulty: "Medium",
    desc: "Old Dhaka's famous fragrant rice cooked with tender beef, mustard oil and green chillies — milder than biryani but full of aroma.",
    ingredients: ["500 g beef, small cubes", "3 cups kalijeera or basmati rice", "1/2 cup mustard oil", "2 onions, sliced", "2 tbsp ginger-garlic paste", "1/2 cup yogurt", "8–10 green chillies", "2 bay leaves, 4 cardamom, 2 cinnamon sticks", "1 tsp garam masala", "Salt to taste", "5 cups hot water"],
    steps: [
      "Wash the rice and soak for 30 minutes, then drain.",
      "Heat mustard oil, fry onions until golden. Add ginger-garlic paste and whole spices.",
      "Add beef, yogurt and salt. Cook covered until the beef is tender and the oil separates.",
      "Add the drained rice and fry for 2–3 minutes with the beef.",
      "Pour in hot water, add green chillies and garam masala. Cover and cook on low heat for 20 minutes.",
      "Rest 10 minutes, fluff gently and serve with salad and lemon."
    ]
  },
  {
    id: 3, name: "Chicken Roast", bn: "চিকেন রোস্ট", category: "Main", img: "images/r3.jpg",
    time: "55 min", servings: 4, difficulty: "Medium",
    desc: "The star of Bangladeshi weddings — chicken legs simmered in a rich, slightly sweet gravy of fried onions, yogurt and ghee.",
    ingredients: ["4 chicken leg quarters", "1 cup fried onion (beresta)", "1/2 cup yogurt", "2 tbsp ginger-garlic paste", "3 tbsp ghee", "1 tsp sugar", "4 cardamom, 2 cinnamon, 2 bay leaves", "1 tsp garam masala", "4 green chillies", "Salt to taste", "Raisins and almonds to garnish"],
    steps: [
      "Marinate the chicken with yogurt, ginger-garlic paste and salt for 30 minutes.",
      "Heat ghee, add whole spices, then the chicken. Fry until lightly browned.",
      "Add half the fried onion and a splash of water. Cover and cook on low heat until tender.",
      "Stir in sugar, garam masala and green chillies. Simmer until the gravy thickens and oil rises.",
      "Garnish with the remaining fried onion, raisins and almonds. Serve with polao."
    ]
  },
  {
    id: 4, name: "Bhuna Khichuri", bn: "ভুনা খিচুড়ি", category: "Rice", img: "images/r4.jpg",
    time: "45 min", servings: 5, difficulty: "Easy",
    desc: "A rainy-day favourite — rice and moong dal roasted and cooked dry-style with spices, best eaten with beef bhuna or an omelette.",
    ingredients: ["2 cups rice", "1 cup moong dal, dry roasted", "1 onion, sliced", "1 tbsp ginger-garlic paste", "3 tbsp oil or ghee", "2 bay leaves, 3 cardamom, 2 cinnamon", "1 tsp turmeric powder", "4 green chillies", "Salt to taste", "4 cups hot water", "1 boiled egg per person (optional)"],
    steps: [
      "Dry roast the moong dal until fragrant, then wash it with the rice.",
      "Heat oil, add whole spices and onion. Fry until golden.",
      "Add ginger-garlic paste, turmeric and salt. Splash in a little water and stir.",
      "Add rice and dal. Fry for 3–4 minutes until well coated.",
      "Pour in hot water, cover and cook on low heat for 20 minutes.",
      "Rest, fluff, and serve with green chillies, lemon and a boiled egg or beef bhuna."
    ]
  },
  {
    id: 5, name: "Chingri Malaikari", bn: "চিংড়ি মালাইকারি", category: "Curry", img: "images/r5.jpg",
    time: "40 min", servings: 4, difficulty: "Medium",
    desc: "Jumbo prawns in a silky coconut-milk gravy — a celebratory dish from Bengal, gently spiced and rich without being heavy.",
    ingredients: ["500 g large prawns (chingri), cleaned", "1 cup coconut milk", "1 onion, made into paste", "1 tbsp ginger paste", "1 tsp turmeric powder", "1 tsp red chilli powder", "2 tbsp mustard oil or ghee", "2 bay leaves, 3 cardamom, 1 cinnamon", "1 tsp sugar", "Salt to taste", "3 green chillies"],
    steps: [
      "Rub the prawns with turmeric and salt. Lightly fry them for 1 minute and set aside.",
      "In the same pan, add bay leaves and whole spices, then the onion paste. Fry until golden.",
      "Add ginger paste, chilli powder and a splash of water. Cook until the oil separates.",
      "Pour in the coconut milk, add sugar and salt. Simmer gently — do not boil hard.",
      "Return the prawns and green chillies. Cook 4–5 minutes until the prawns are just done.",
      "Serve hot with plain white rice."
    ]
  },
  {
    id: 6, name: "Aloo Bhorta", bn: "আলু ভর্তা", category: "Side", img: "images/r6.jpg",
    time: "20 min", servings: 4, difficulty: "Easy",
    desc: "Bangladesh's beloved mashed potato with mustard oil, dried red chillies and raw onion — simple comfort on every plate of rice and dal.",
    ingredients: ["4 large potatoes", "2 dried red chillies", "1 small onion, finely sliced", "2 tbsp mustard oil", "Salt to taste", "Fresh coriander leaves (optional)"],
    steps: [
      "Boil the potatoes until completely soft. Peel while warm.",
      "Fry the dried red chillies in mustard oil until crisp, then crumble them.",
      "Mash the potatoes by hand with salt, the chilli oil and sliced onion.",
      "Mix well until fluffy. Add coriander if you like.",
      "Shape into a mound and serve with hot rice and dal."
    ]
  },
  {
    id: 7, name: "Masoor Dal", bn: "মসুর ডাল", category: "Curry", img: "images/r7.jpg",
    time: "30 min", servings: 4, difficulty: "Easy",
    desc: "Everyday red lentil dal with a garlic and dried-chilli tempering — the soul of a Bangladeshi lunch.",
    ingredients: ["1 cup masoor dal (red lentils)", "1 small onion, sliced", "1 tsp turmeric powder", "4 cloves garlic, sliced", "2 dried red chillies", "2 tbsp mustard oil", "1 tomato, chopped (optional)", "Salt to taste", "3 cups water", "Fresh coriander to garnish"],
    steps: [
      "Wash the dal and boil with water, turmeric, onion, tomato and salt until soft and soupy.",
      "Whisk the dal lightly to break it down. Adjust the water to your preferred thickness.",
      "Heat mustard oil in a small pan. Fry garlic and dried chillies until golden and fragrant.",
      "Pour the hot tempering (bagar) over the dal and cover immediately for a minute.",
      "Garnish with coriander and serve with rice and aloo bhorta."
    ]
  },
  {
    id: 8, name: "Firni", bn: "ফিরনি", category: "Dessert", img: "images/r8.jpg",
    time: "35 min + chilling", servings: 6, difficulty: "Easy",
    desc: "A creamy ground-rice pudding set in clay bowls, flavoured with cardamom and topped with pistachios — a classic Eid dessert.",
    ingredients: ["1 litre full-cream milk", "1/4 cup basmati rice, soaked and ground coarse", "1/2 cup sugar (to taste)", "4 cardamom pods, crushed", "1 tbsp rose water (optional)", "Chopped pistachios and almonds to garnish"],
    steps: [
      "Soak the rice for 1 hour, drain and grind coarsely with a little milk.",
      "Boil the milk in a heavy pan, then lower the heat.",
      "Stir in the ground rice slowly so no lumps form. Cook, stirring often, until thick and creamy.",
      "Add sugar and cardamom. Cook 3–4 more minutes.",
      "Remove from heat, stir in rose water and pour into small clay bowls.",
      "Chill for at least 2 hours. Garnish with nuts before serving."
    ]
  }
];

const CATEGORIES = ["All", "Main", "Curry", "Rice", "Side", "Dessert"];
const FAV_KEY = "bangla-recipe-book-favs";

let favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]"));
let activeCategory = "All";
let favOnly = false;
let query = "";

const grid = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function saveFavs(){ localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }

function heartSVG(){ return '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>'; }

function renderChips(){
  chipsEl.innerHTML = CATEGORIES.map(c =>
    `<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join("");
  chipsEl.querySelectorAll(".chip").forEach(btn =>
    btn.addEventListener("click", () => { activeCategory = btn.dataset.cat; render(); }));
}

function matches(r){
  if (activeCategory !== "All" && r.category !== activeCategory) return false;
  if (favOnly && !favorites.has(r.id)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  const hay = [r.name, r.bn, r.category, r.desc, ...r.ingredients].join(" ").toLowerCase();
  return hay.includes(q);
}

function render(){
  renderChips();
  const list = RECIPES.filter(matches);
  countEl.textContent = list.length + (list.length === 1 ? " recipe" : " recipes") +
    (activeCategory !== "All" ? " in " + activeCategory : "") + (favOnly ? " · favorites only" : "");
  emptyEl.hidden = list.length > 0;
  grid.innerHTML = list.map(r => `
    <article class="card">
      <div class="photo" data-open="${r.id}">
        <img src="${r.img}" alt="${r.name}" loading="lazy">
        <span class="badge">${r.category}</span>
        <button class="heart ${favorites.has(r.id)?'on':''}" data-fav="${r.id}" aria-label="Favorite ${r.name}">${heartSVG()}</button>
      </div>
      <div class="card-body">
        <h3 data-open="${r.id}">${r.name}</h3>
        <span class="bn-name">${r.bn}</span>
        <p>${r.desc}</p>
        <div class="meta"><span>Time <b>${r.time}</b></span><span>Serves <b>${r.servings}</b></span><span><b>${r.difficulty}</b></span></div>
        <button class="view-btn" data-open="${r.id}">View Recipe</button>
      </div>
    </article>`).join("");
  grid.querySelectorAll("[data-open]").forEach(el =>
    el.addEventListener("click", e => { if (!e.target.closest("[data-fav]")) openRecipe(+el.dataset.open); }));
  grid.querySelectorAll("[data-fav]").forEach(btn =>
    btn.addEventListener("click", e => { e.stopPropagation(); toggleFav(+btn.dataset.fav); }));
}

function toggleFav(id){
  favorites.has(id) ? favorites.delete(id) : favorites.add(id);
  saveFavs(); render();
}

function openRecipe(id){
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;
  modal.innerHTML = `
    <img class="hero" src="${r.img}" alt="${r.name}">
    <div class="modal-body">
      <div class="modal-head">
        <div>
          <h2>${r.name}</h2>
          <span class="bn-name">${r.bn} · ${r.category}</span>
        </div>
        <div style="display:flex;gap:8px">
          <button class="heart ${favorites.has(r.id)?'on':''}" id="modalFav" aria-label="Favorite">${heartSVG()}</button>
          <button class="close-btn" id="modalClose" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="meta"><span>Time <b>${r.time}</b></span><span>Serves <b>${r.servings}</b></span><span>Difficulty <b>${r.difficulty}</b></span></div>
      <p class="desc">${r.desc}</p>
      <h3>Ingredients</h3>
      <ul class="ing-list">${r.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>
      <h3>Cooking Steps</h3>
      <ol class="steps">${r.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    </div>`;
  overlay.classList.add("open");
  document.getElementById("modalClose").addEventListener("click", closeRecipe);
  document.getElementById("modalFav").addEventListener("click", function(){
    toggleFav(r.id); this.classList.toggle("on", favorites.has(r.id));
  });
  document.body.style.overflow = "hidden";
}
function closeRecipe(){ overlay.classList.remove("open"); document.body.style.overflow = ""; }
overlay.addEventListener("click", e => { if (e.target === overlay) closeRecipe(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeRecipe(); });

document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
document.getElementById("favToggle").addEventListener("click", function(){
  favOnly = !favOnly; this.classList.toggle("active", favOnly); this.setAttribute("aria-pressed", favOnly);
  render();
});

render();
</script>
</body>
</html>
